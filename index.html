<style>
/* App layout: one exercise per screen, progress bar on top, answer bar pinned to the bottom (like language apps). */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --ink:#16202B; --muted:#5D6877; --line:#D6DDE7;
  --accent:#2B5FD9; --accent-ink:#FFFFFF; --accent-soft:#E4ECFC;
  --ok:#1B8A4E; --ok-soft:#DDF3E6; --bad:#C23B2E; --bad-soft:#FBE4E1;
  --gold:#E8A317; --tile:#FFFFFF; --tile-shadow:#C9D2DF;
  --f:-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161E29; --ink:#E6EBF2; --muted:#9AA5B3; --line:#2A3544;
  --accent:#7FA6FF; --accent-ink:#0B1426; --accent-soft:#1A2843;
  --ok:#5ED394; --ok-soft:#143322; --bad:#FF8A7D; --bad-soft:#3A1A17;
  --gold:#F2B940; --tile:#1D2734; --tile-shadow:#0A0F16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161E29; --ink:#E6EBF2; --muted:#9AA5B3; --line:#2A3544;
  --accent:#7FA6FF; --accent-ink:#0B1426; --accent-soft:#1A2843;
  --ok:#5ED394; --ok-soft:#143322; --bad:#FF8A7D; --bad-soft:#3A1A17;
  --gold:#F2B940; --tile:#1D2734; --tile-shadow:#0A0F16; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f);-webkit-text-size-adjust:100%;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
h1,h2{margin:0;line-height:1.2}
.muted{color:var(--muted)} .small{font-size:.85rem}

/* home */
.home{display:flex;flex-direction:column;gap:16px;padding:24px 0 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.big{width:100%;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.big.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.big:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.wl{display:flex;flex-direction:column}
.wl .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.wl .row:first-child{border-top:0}
.wl a{color:inherit;text-decoration:underline dotted var(--accent);text-underline-offset:3px}
.dots{display:flex;gap:3px;flex:0 0 auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.linkbtn{background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;font-size:.9rem;text-align:left}

/* exercise */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.x{border:0;background:none;font-size:1.4rem;color:var(--muted);cursor:pointer;padding:4px 6px}
.top .bar{flex:1}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right}
.ex{flex:1;display:flex;flex-direction:column;gap:16px;padding:12px 0 150px}
.kind{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prompt{font-size:1.45rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt.ru{font-weight:600;font-size:1.25rem}
.sub{color:var(--muted)}
.spk{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:1.2rem;cursor:pointer;flex:0 0 auto}
.spk.huge{width:96px;height:96px;font-size:2.4rem;border-radius:20px;margin:6px auto}
.opts{display:grid;gap:10px}
.o{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:1.02rem}
.o.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.o.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.o.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.o:disabled{cursor:default}
.gapline{font-size:1.2rem;line-height:1.6}
.gapline .blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--accent);margin:0 .2em}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{border:2px solid var(--line);background:var(--tile);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 var(--tile-shadow);cursor:pointer;font-size:1.02rem}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .o{text-align:center;padding:12px 8px;font-size:.98rem}
.pairs .o.done{opacity:.25;box-shadow:none}
input.typ{font:inherit;font-size:1.2rem;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
input.typ:focus{outline:none;border-color:var(--accent)}
.hint{font-size:.9rem;color:var(--muted);letter-spacing:.15em}
.intro{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.intro .w{font-size:2rem;font-weight:800}
.intro .tr{font-size:1.15rem}
.intro .exm{font-style:italic}
.new{align-self:center;background:var(--gold);color:#1c1300;font-weight:800;font-size:.75rem;letter-spacing:.08em;padding:3px 10px;border-radius:999px}

/* bottom answer bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--line);
  padding:14px max(16px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-weight:800;font-size:1.1rem}
.foot.ok .fb{color:var(--ok)} .foot.bad .fb{color:var(--bad)}
.fbx{font-size:.95rem}
.foot.ok .big{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.foot.bad .big{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}

/* result */
.result{display:flex;flex-direction:column;gap:16px;padding:40px 0;text-align:center}
.result .trophy{font-size:4rem}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* bottom tabs */
.home,.page{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);cursor:pointer;border-radius:10px}
.nav button span{font-size:1.35rem;line-height:1}
.nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
/* homework + rules pages */
.page{display:flex;flex-direction:column;gap:14px;padding-top:24px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:1.1rem}
.pill{font-size:.75rem;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.done{color:var(--ok)}
.hq{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.hq:first-of-type{border-top:0;padding-top:0}
.hq .qt b{color:var(--muted);font-weight:500;margin-right:6px}
.hq .blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--muted)}
.hq .opts{grid-template-columns:1fr}
.hq .o{padding:10px 12px;font-size:.98rem}
.hq input,.hq textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper,var(--surface));color:var(--ink)}
.hq input.right,.hq textarea.right{border-color:var(--ok);background:var(--ok-soft)}
.hq input.wrong,.hq textarea.wrong{border-color:var(--bad);background:var(--bad-soft)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.9rem;font-weight:600}
.sbtn.ok{border-color:var(--ok);color:var(--ok)} .sbtn.no{border-color:var(--bad);color:var(--bad)}
.ansline{font-size:.92rem} .ansline.good{color:var(--ok)} .ansline.bad{color:var(--bad)}
.ansline b{color:var(--ink)}
.medialink{display:block;border:2px solid var(--accent);border-radius:12px;padding:12px;color:var(--accent);text-decoration:none;font-weight:700;background:var(--accent-soft)}
.medialink span{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.rules details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.rules summary{font-weight:700;font-size:1.05rem;padding:10px 0;cursor:pointer}
.rules details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
.rules h3{font-size:1rem;margin:12px 0 6px}
.rules p{margin:6px 0}
.rules .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 10px}
.rules table{border-collapse:collapse;width:100%;min-width:520px;font-size:.88rem}
.rules th,.rules td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{background:var(--accent-soft)}
.rules .tr{color:var(--muted)}
.rules .x{color:var(--bad);text-decoration:line-through}
.rules .v{color:var(--ok);font-weight:600}
.rules .rule{background:var(--accent-soft);border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px;margin:8px 0}
.rules .small{font-size:.85rem;color:var(--muted)}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.readtext{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.65}
.readtext h3{font-family:var(--f);margin:0 0 8px;font-size:1.1rem}
.readtext p{margin:0 0 10px}
.readtext .pn{display:inline-block;min-width:1.4em;font:700 .75rem var(--f);color:var(--muted);vertical-align:top}
.rsearch{font:inherit;font-size:16px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.rsearch:focus{outline:none;border-color:var(--accent)}
.lesson-group{display:flex;flex-direction:column;gap:8px}
.lesson-div{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.lesson-div::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.lesson-num{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
.lesson-name{font-weight:700;color:var(--muted);white-space:nowrap}
.rules summary{display:flex;align-items:baseline;gap:8px;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:1.3rem;line-height:1;transition:transform .15s}
.rules details[open] summary::after{transform:rotate(90deg)}
/* rules text size is chosen by the reader (A− / A+), tables shrink to the screen width instead of scrolling */
.rules{--rfs:.82rem}
.rules details.topic{font-size:var(--rfs)}
.rules details.topic summary{font-size:1rem}
.rules .tbl{overflow-x:auto}
.rules table{min-width:0;width:100%;table-layout:auto;font-size:1em}
.rules th,.rules td{padding:5px 6px;overflow-wrap:anywhere;hyphens:auto}
.rules .x{font-size:inherit;padding:0;cursor:auto}
.fsrow{display:flex;align-items:center;gap:8px}
.fsrow .lbl{font-size:.85rem;color:var(--muted);margin-right:auto}
.fsbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:40px;font-weight:800;cursor:pointer}
.fsbtn:disabled{opacity:.35}
.fsbtn.small{font-size:.8rem} .fsbtn.big2{font-size:1.15rem}
.tag{flex:0 0 auto;font-size:.7rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;white-space:nowrap}
.steps-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.transcript-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.transcript-box p{margin:4px 0}
.sec details summary{color:var(--accent);cursor:pointer;font-size:.92rem}
.nav button{font-size:.7rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:min(92vw,480px);
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.copybox{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

er version of the evening you spent getting lost in Lisbon with your partner. It belongs only to you.","Of course, this doesn\u0027t mean we should stop buying things. A good bed or a reliable car makes life easier every day. But the next time you are choosing between a new gadget and a weekend away, the research suggests that the weekend might be the better investment."],"READ":[{"t":"mc","q":"What is the main idea of the text?","o":["People should stop buying things","Experiences usually make us happier than things","Travelling is cheaper than shopping"],"a":1},{"t":"mc","q":"According to the text, what happens to our memories of a trip?","o":["We forget them in a few months","They become boring, like a new phone","They often get better with time"],"a":2},{"t":"mc","q":"Why does the writer mention a new fridge?","o":["To show that stories about things are less interesting to other people","Because a fridge is an expensive purchase","To compare two kinds of fridges"],"a":0},{"t":"mc","q":"\"Experiences are harder to compare\" means that…","o":["experiences cost more than things","it is hard to say that someone else\u0027s experience is better than yours","we can\u0027t remember experiences well"],"a":1},{"t":"mc","q":"What does the writer think about buying things?","o":["Some things, like a good bed, are still worth buying","We should never buy gadgets","Things are always a bad investment"],"a":0},{"t":"mc","q":"In paragraph 5, \"reliable\" is closest in meaning to…","o":["very fast","very cheap","one you can trust that doesn\u0027t break"],"a":2},{"t":"mc","q":"\"Where have you been this year?\" Why is this question in the present perfect?","o":["Because \"this year\" is not finished yet","Because it asks about a specific date","It\u0027s a mistake: it should be past simple"],"a":0},{"t":"gap","q":"Find a word in paragraph 2 that means «захватывающий дух».","a":"breathtaking"}],"WARM":[{"t":"mc","q":"We can\u0027t ___ a new car this year.","o":["allow","afford"," const RULES=[{"title":"Урок 2 · Experiences","html":"\n\n\n\n\n\u003ch2\u003e1. Have you ever…? Как спросить об опыте\u003c/h2\u003e\n\u003cp\u003eРазговор об опыте почти всегда идёт в два шага. Сначала спрашиваем, было ли такое вообще (present perfect). Если было, расспрашиваем о конкретном случае (past simple).\u003c/p\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:24%\"\u003eШаг\u003c/th\u003e\u003cth style=\"width:16%\"\u003eВремя\u003c/th\u003e\u003cth\u003eПример и перевод\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e1. Было ли такое когда-нибудь в жизни?\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eHave\u003c/b\u003e you ever \u003cb\u003ebeen\u003c/b\u003e to Egypt?\u003cbr\u003e\u003cspan class=\"tr\"\u003eТы когда-нибудь был в Египте?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eОтвет «да / нет»\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eYes, I \u003cb\u003ehave\u003c/b\u003e. I\u003cb\u003e\u0027ve been\u003c/b\u003e there twice.\u003cbr\u003eNo, I \u003cb\u003ehaven\u0027t\u003c/b\u003e. / No, \u003cb\u003enever\u003c/b\u003e.\u003cbr\u003e\u003cspan class=\"tr\"\u003eДа, был, дважды. / Нет, не был. / Нет, никогда.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e2. Подробности о конкретном разе: когда, с кем, как было\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eWhen \u003cb\u003edid\u003c/b\u003e you \u003cb\u003ego\u003c/b\u003e? — I \u003cb\u003ewent\u003c/b\u003e there in 2023.\u003cbr\u003eWhat \u003cb\u003ewas\u003c/b\u003e it like? — It \u003cb\u003ewas\u003c/b\u003e amazing!\u003cbr\u003e\u003cspan class=\"tr\"\u003eКогда ты ездил? — В 2023 году. Как там было? — Потрясающе!\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eПростое правило.\u003c/b\u003e Вопрос «Have you ever…?» — про всю жизнь, поэтому present perfect. Как только речь зашла о конкретном разе (когда, где, с кем), переходим на past simple.\u003c/div\u003e\n\n\u003ch2\u003e2. Been to, gone to, been in\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:16%\"\u003e\u003c/th\u003e\u003cth style=\"width:28%\"\u003eЧто значит\u003c/th\u003e\u003cth\u003eПример и перевод\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ehave been to\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпобывал где-то и уже вернулся\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u003cb\u003e\u0027ve been to\u003c/b\u003e Georgia three times.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ был в Грузии три раза.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ehave gone to\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eуехал туда и сейчас там, ещё не вернулся\u003c/td\u003e\u003ctd class=\"en\"\u003eTom isn\u0027t here. He\u003cb\u003e\u0027s gone to\u003c/b\u003e the gym.\u003cbr\u003e\u003cspan class=\"tr\"\u003eТома нет. Он ушёл в спортзал (и сейчас там).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ehave been in\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eнаходится где-то какое-то время, часто с for или since\u003c/td\u003e\u003ctd class=\"en\"\u003eWe\u003cb\u003e\u0027ve been in\u003c/b\u003e Italy since 2022.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы в Италии с 2022 года (и сейчас здесь).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eЧастая ошибка.\u003c/b\u003e По-русски «был в Канаде», поэтому хочется сказать \u003cspan class=\"x\"\u003ebeen in Canada\u003c/span\u003e. Если речь о поездке («побывал»), нужно \u003cspan class=\"v\"\u003ebeen to Canada\u003c/span\u003e.\u003c/div\u003e\n\n\u003ch2\u003e3. «Самый… в жизни»: the best … I\u0027ve ever …\u003c/h2\u003e\n\u003cp\u003eПосле «самый лучший», «самый длинный», «самый красивый» говорят \u003cb\u003eI\u0027ve ever + 3-я форма глагола\u003c/b\u003e: это опыт за всю жизнь до сегодняшнего дня. Слово which не нужно.\u003c/p\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eПример\u003c/th\u003e\u003cth\u003eПеревод\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003eIt\u0027s \u003cb\u003ethe best\u003c/b\u003e pizza \u003cb\u003eI\u0027ve ever eaten\u003c/b\u003e.\u003c/td\u003e\u003ctd\u003eЭто самая вкусная пицца в моей жизни.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003eIt\u0027s \u003cb\u003ethe most beautiful\u003c/b\u003e place \u003cb\u003eI\u0027ve ever seen\u003c/b\u003e.\u003c/td\u003e\u003ctd\u003eЭто самое красивое место, которое я видела.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003eThis is \u003cb\u003ethe longest\u003c/b\u003e flight \u003cb\u003ewe\u0027ve ever taken\u003c/b\u003e.\u003c/td\u003e\u003ctd\u003eЭто самый долгий перелёт в нашей жизни.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003eShe\u0027s \u003cb\u003ethe funniest\u003c/b\u003e person \u003cb\u003eI\u0027ve ever met\u003c/b\u003e.\u003c/td\u003e\u003ctd\u003eОна самый смешной человек из всех, кого я встречал.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eТак нельзя\u003c/th\u003e\u003cth\u003eПравильно\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003ethe best pizza which I ate in my life\u003c/td\u003e\u003ctd class=\"en v\"\u003ethe best pizza I\u0027ve ever eaten\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003ethe biggest waterfall which I saw\u003c/td\u003e\u003ctd class=\"en v\"\u003ethe biggest waterfall I\u0027ve ever seen\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2\u003e4. Сколько раз: once, twice, for the first time\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:26%\"\u003eСлово\u003c/th\u003e\u003cth style=\"width:22%\"\u003eПеревод\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eonce\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eодин раз\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027ve been to Paris \u003cb\u003eonce\u003c/b\u003e.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003etwice\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eдва раза\u003c/td\u003e\u003ctd class=\"en\"\u003eWe\u0027ve been to Batumi \u003cb\u003etwice\u003c/b\u003e.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ethree times, many times\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eтри раза, много раз\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027ve seen this film \u003cb\u003ethree times\u003c/b\u003e.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003enever\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eникогда\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027ve \u003cb\u003enever\u003c/b\u003e been abroad alone.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003efor the first time\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eвпервые\u003c/td\u003e\u003ctd class=\"en\"\u003eI flew alone \u003cb\u003efor the first time\u003c/b\u003e at 19.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ethe last time\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eв последний раз\u003c/td\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eThe last time\u003c/b\u003e I went to the sea was in July.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003eОдин раз — \u003cb\u003eonce\u003c/b\u003e или \u003cb\u003eone time\u003c/b\u003e (но не просто \u003cspan class=\"x\"\u003eone\u003c/span\u003e), два раза — \u003cb\u003etwice\u003c/b\u003e. Впервые — \u003cb\u003efor the first time\u003c/b\u003e (не \u003cspan class=\"x\"\u003ein the first time\u003c/span\u003e). Если назвали время (at 19, in 2023), глагол в past simple: I \u003cb\u003etravelled\u003c/b\u003e alone for the first time at 19.\u003c/div\u003e\n\n\u003ch2\u003e5. Вопросы и отрицания в past simple: did + первая форма\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eТак нельзя\u003c/th\u003e\u003cth\u003eПравильно\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWhen did you saw it?\u003c/td\u003e\u003ctd class=\"en v\"\u003eWhen did you see it?\u003c/td\u003e\u003ctd\u003eПрошедшее время уже показывает did, поэтому сам глагол остаётся в первой форме\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI didn\u0027t went there.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI didn\u0027t go there.\u003c/td\u003e\u003ctd\u003eТо же самое в отрицании: didn\u0027t + первая форма\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eDid you liked it?\u003c/td\u003e\u003ctd class=\"en v\"\u003eDid you like it?\u003c/td\u003e\u003ctd\u003eDid + like, без -ed\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2 class=\"page\"\u003e6. Пары слов, которые путают\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:22%\"\u003eСлова\u003c/th\u003e\u003cth\u003eРазница и примеры\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edeny\u003c/b\u003e / \u003cb\u003erefuse\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003edeny + -ing\u003c/b\u003e — отрицать, что сделал: \u003cspan class=\"en\"\u003eHe denied eating the pizza.\u003c/span\u003e \u003cspan class=\"tr\"\u003eОн отрицал, что съел пиццу.\u003c/span\u003e\u003cbr\u003e\u003cb\u003erefuse + to\u003c/b\u003e — отказаться делать: \u003cspan class=\"en\"\u003eHe refused to eat the pizza.\u003c/span\u003e \u003cspan class=\"tr\"\u003eОн отказался есть пиццу.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ediscuss\u003c/b\u003e / \u003cb\u003etalk about\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eС discuss предлог не нужен: \u003cspan class=\"en\"\u003eWe discussed the trip.\u003c/span\u003e С talk нужен about: \u003cspan class=\"en\"\u003eWe talked about the trip.\u003c/span\u003e \u003cspan class=\"tr\"\u003eМы обсудили поездку.\u003c/span\u003e Нельзя: \u003cspan class=\"x\"\u003ediscussed about\u003c/span\u003e.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elook forward to\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eto здесь обязателен, после него -ing: \u003cspan class=\"en\"\u003eI\u0027m looking forward \u003cb\u003eto seeing\u003c/b\u003e you.\u003c/span\u003e Нельзя: \u003cspan class=\"x\"\u003elooking forward seeing\u003c/span\u003e, \u003cspan class=\"x\"\u003elooking forward to see\u003c/span\u003e.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003erun out of\u003c/b\u003e / \u003cb\u003eput off\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003erun out of\u003c/b\u003e — закончиться: \u003cspan class=\"en\"\u003eWe ran out of money.\u003c/span\u003e \u003cspan class=\"tr\"\u003eУ нас закончились деньги.\u003c/span\u003e\u003cbr\u003e\u003cb\u003eput off\u003c/b\u003e — отложить: \u003cspan class=\"en\"\u003eWe put off the trip.\u003c/span\u003e \u003cspan class=\"tr\"\u003eМы отложили поездку.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2\u003e7. Ошибки из домашки 1\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eКак написали\u003c/th\u003e\u003cth\u003eКак правильно\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eOur flight has delayed.\u003c/td\u003e\u003ctd class=\"en v\"\u003eOur flight was delayed.\u003c/td\u003e\u003ctd\u003eРейс не задержался сам, его задержали. Это страдательный залог: was / were + 3-я форма (was delayed, was built, were cancelled)\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHave you ever seen game Lakers?\u003c/td\u003e\u003ctd class=\"en v\"\u003eHave you ever seen a Lakers game?\u003c/td\u003e\u003ctd\u003eНазвание ставится впереди, как прилагательное: a Lakers game, a Nike shop\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWife and I haven\u0027t booked hotel.\u003c/td\u003e\u003ctd class=\"en v\"\u003eMy wife and I haven\u0027t booked the hotel.\u003c/td\u003e\u003ctd\u003eПеред wife нужно my, перед hotel нужно the (понятно, какой отель)\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI\u0027ve never been in Canada.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI\u0027ve never been to Canada.\u003c/td\u003e\u003ctd\u003eПобывать — been to\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2\u003e8. Слова урока 2\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:24%\"\u003eСлово\u003c/th\u003e\u003cth style=\"width:30%\"\u003eПеревод\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003esouvenir\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eсувенир\u003c/td\u003e\u003ctd class=\"en\"\u003eWe bought some souvenirs at the market.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ego sightseeing\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eосматривать достопримечательности\u003c/td\u003e\u003ctd class=\"en\"\u003eWe went sightseeing all day.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ecrowded\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eлюдный, переполненный\u003c/td\u003e\u003ctd class=\"en\"\u003eThe beach was very crowded.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eunforgettable\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eнезабываемый\u003c/td\u003e\u003ctd class=\"en\"\u003eIt was an unforgettable trip.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eworth it\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eоно того стоит\u003c/td\u003e\u003ctd class=\"en\"\u003eThe hike was hard, but it was worth it.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eexplore\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eисследовать, обходить (место)\u003c/td\u003e\u003ctd class=\"en\"\u003eWe explored the old town on foot.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eabroad\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eза границей, за границу\u003c/td\u003e\u003ctd class=\"en\"\u003eHave you ever lived abroad?\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elandmark\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eдостопримечательность, известное место\u003c/td\u003e\u003ctd class=\"en\"\u003eThe Colosseum is Rome\u0027s most famous landmark.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003erefuse\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eотказываться\u003c/td\u003e\u003ctd class=\"en\"\u003eHe refused to eat the soup.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ediscuss\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eобсуждать (без about)\u003c/td\u003e\u003ctd class=\"en\"\u003eWe discussed our plans for the summer.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp class=\"small\"\u003eПроизношение и больше примеров — в словаре Cambridge (dictionary.cambridge.org) и во вкладке «Слова» приложения.\u003c/p\u003e\n"},{"title":"Урок 1 · Our trips","html":"\n\n\n\n\n\u003ch2\u003e1. Present perfect или past simple\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:18%\"\u003e\u003c/th\u003e\u003cth\u003ePresent perfect\u003c/th\u003e\u003cth\u003ePast simple\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eКак строится\u003c/td\u003e\u003ctd class=\"en\"\u003ehave / has + 3-я форма глагола (V3)\u003cbr\u003eI \u003cb\u003ehave seen\u003c/b\u003e · she \u003cb\u003ehas been\u003c/b\u003e · we \u003cb\u003ehave booked\u003c/b\u003e\u003c/td\u003e\u003ctd class=\"en\"\u003e2-я форма (V2), в вопросе и отрицании did\u003cbr\u003eI \u003cb\u003esaw\u003c/b\u003e · she \u003cb\u003ewas\u003c/b\u003e · \u003cb\u003edid\u003c/b\u003e you \u003cb\u003esee\u003c/b\u003e? · I \u003cb\u003edidn\u0027t see\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eСлова-подсказки\u003c/td\u003e\u003ctd class=\"en\"\u003eever, never, just, already, yet, so far, for, since, this year / this week / today (если период ещё идёт)\u003c/td\u003e\u003ctd class=\"en\"\u003eyesterday, last week, last year, … ago, in 2023, in March, when I was a child\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eВопрос\u003c/td\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eHave\u003c/b\u003e you ever \u003cb\u003ebeen\u003c/b\u003e to Canada?\u003cbr\u003eHow long \u003cb\u003ehave\u003c/b\u003e you \u003cb\u003eknown\u003c/b\u003e each other?\u003c/td\u003e\u003ctd class=\"en\"\u003eWhen \u003cb\u003edid\u003c/b\u003e you \u003cb\u003ego\u003c/b\u003e to Canada?\u003cbr\u003eHow long \u003cb\u003edid\u003c/b\u003e you \u003cb\u003estay\u003c/b\u003e there?\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch3\u003eКогда какое время\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:30%\"\u003eСитуация\u003c/th\u003e\u003cth style=\"width:15%\"\u003eВремя\u003c/th\u003e\u003cth\u003eПример и перевод\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eГоворим, что такое было в жизни, но не говорим когда\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave been\u003c/b\u003e to Turkey.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ была в Турции (когда-то, неважно когда).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eГоворим, когда именно это было\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ewent\u003c/b\u003e to Turkey last year.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ ездила в Турцию в прошлом году.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eНачалось в прошлом и продолжается сейчас. По-русски здесь настоящее время: «живу с…», «знаю уже…»\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave lived\u003c/b\u003e in Italy since 2022.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ живу в Италии с 2022 года (и сейчас живу).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eБыло и закончилось, сейчас уже не так\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003elived\u003c/b\u003e in Germany for two years.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ жил в Германии два года (сейчас уже не живу).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eЧто-то случилось, и результат виден сейчас\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave lost\u003c/b\u003e my keys.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ потерял ключи (и до сих пор не нашёл).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eРассказываем историю: что было сначала, что потом\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eWe \u003cb\u003earrived\u003c/b\u003e, \u003cb\u003echecked in\u003c/b\u003e and \u003cb\u003ewent\u003c/b\u003e to the beach.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы приехали, заселились и пошли на пляж.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e«Самый… за всю жизнь»\u003c/td\u003e\u003ctd\u003ePresent perfect + ever\u003c/td\u003e\u003ctd class=\"en\"\u003eIt\u0027s the most beautiful waterfall I\u003cb\u003e\u0027ve ever seen\u003c/b\u003e.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЭто самый красивый водопад, который я видела.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eПростое правило.\u003c/b\u003e Если в предложении есть yesterday, last…, … ago, in 2023, when I was… или ясно, когда это было, ставим \u003cb\u003epast simple\u003c/b\u003e. Если даты нет, а важно «было в жизни» или «до сих пор», ставим \u003cb\u003epresent perfect\u003c/b\u003e.\u003c/div\u003e\n\n\u003ch3\u003eThis year, today, this week: незаконченный период\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eПериод\u003c/th\u003e\u003cth\u003eЗакончился?\u003c/th\u003e\u003cth\u003eВремя\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003ethis year, this month, this week, today\u003c/td\u003e\u003ctd\u003eНет, ещё идёт\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave been\u003c/b\u003e to Rome twice this year.\u003cbr\u003e\u003cspan class=\"tr\"\u003eВ этом году я уже дважды была в Риме (год ещё не кончился).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003elast year, yesterday, in 2023\u003c/td\u003e\u003ctd\u003eДа\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ewent\u003c/b\u003e to Rome last year.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003ethis morning, если сейчас вечер\u003c/td\u003e\u003ctd\u003eДа, утро прошло\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003edrank\u003c/b\u003e too much coffee this morning.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003ethis morning, если сейчас ещё утро\u003c/td\u003e\u003ctd\u003eНет\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave drunk\u003c/b\u003e three coffees this morning.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp\u003eЕсли внутри незаконченного года назвать конкретный момент, снова нужен past simple: \u003cspan class=\"en\"\u003eI \u003cb\u003ewent\u003c/b\u003e to Rome \u003cb\u003ein March\u003c/b\u003e.\u003c/span\u003e\u003c/p\u003e\n\n\u003ch2\u003e2. For, since, during\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:18%\"\u003e\u003c/th\u003e\u003cth\u003efor\u003c/th\u003e\u003cth\u003esince\u003c/th\u003e\u003cth\u003eduring\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eОтвечает на вопрос\u003c/td\u003e\u003ctd\u003e\u003cb\u003eКак долго?\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003eС какого момента?\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003eКогда? Во время чего?\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eЧто идёт после\u003c/td\u003e\u003ctd\u003eчисло + время\u003cbr\u003e\u003cspan class=\"en\"\u003efor two hours, for three years, for a long time\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eточка начала\u003cbr\u003e\u003cspan class=\"en\"\u003esince 2019, since Monday, since I was 15\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eсобытие или период без чисел\u003cbr\u003e\u003cspan class=\"en\"\u003eduring the trip, during the film, during the summer\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eПример\u003c/td\u003e\u003ctd class=\"en\"\u003eWe\u0027ve been married \u003cb\u003efor\u003c/b\u003e two years.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы женаты уже два года.\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"en\"\u003eWe\u0027ve been married \u003cb\u003esince\u003c/b\u003e 2024.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы женаты с 2024 года.\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"en\"\u003eWe met nice people \u003cb\u003eduring\u003c/b\u003e the trip.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы встретили приятных людей во время поездки.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp\u003eВместе в одном предложении: \u003cspan class=\"en\"\u003eI slept \u003cb\u003efor two hours\u003c/b\u003e \u003cb\u003eduring the flight\u003c/b\u003e.\u003c/span\u003e \u003cspan class=\"tr\"\u003e«Два часа» отвечает на вопрос «сколько?», «во время перелёта» — на вопрос «когда?».\u003c/span\u003e\u003c/p\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eПроверка.\u003c/b\u003e По-русски «в течение трёх лет», но по-английски \u003cspan class=\"x\"\u003eduring three years\u003c/span\u003e → \u003cspan class=\"v\"\u003efor three years\u003c/span\u003e: после during не бывает чисел.\u003c/div\u003e\n\n\u003ch2\u003e3. Вопросы «как долго» и «когда последний раз»\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eЧто хотим спросить\u003c/th\u003e\u003cth\u003eКак сказать\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eСколько ты уже живёшь в Италии? (и сейчас живёшь)\u003c/td\u003e\u003ctd class=\"en\"\u003eHow long \u003cb\u003ehave\u003c/b\u003e you \u003cb\u003elived\u003c/b\u003e in Italy?\u003c/td\u003e\u003ctd\u003eПродолжается до сих пор → present perfect\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eСколько ты пробыл в Грузии в прошлом году?\u003c/td\u003e\u003ctd class=\"en\"\u003eHow long \u003cb\u003edid\u003c/b\u003e you \u003cb\u003estay\u003c/b\u003e in Georgia last year?\u003c/td\u003e\u003ctd\u003eЗакончилось → past simple. О поездке — stay, а не live\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eКак долго ты не был в отпуске?\u003c/td\u003e\u003ctd class=\"en\"\u003eHow long \u003cb\u003ehas it been since\u003c/b\u003e your last vacation?\u003cbr\u003eWhen \u003cb\u003ewas\u003c/b\u003e your last vacation?\u003c/td\u003e\u003ctd\u003e«Как долго не…» по-английски не спрашивают. Говорят: «сколько прошло с…»\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eЯ не был в отпуске два года.\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehaven\u0027t been\u003c/b\u003e on vacation for two years.\u003c/td\u003e\u003ctd\u003eВ утверждении отрицание нормально. В отпуске — \u003cb\u003eon\u003c/b\u003e vacation / \u003cb\u003eon\u003c/b\u003e holiday\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2 class=\"page\"\u003e4. Частая ошибка: глагол + -ing\u003c/h2\u003e\n\u003cp\u003eПосле этих глаголов второй глагол ставим с \u003cb\u003e-ing\u003c/b\u003e, хотя по-русски там «встретиться», «готовить», «лететь». Правила тут нет, их просто нужно запомнить.\u003c/p\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:17%\"\u003eГлагол\u003c/th\u003e\u003cth style=\"width:16%\"\u003eЗначение\u003c/th\u003e\u003cth\u003eПримеры\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003esuggest\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eпредлагать\u003c/td\u003e\u003ctd class=\"en\"\u003eI suggest \u003cb\u003egoing\u003c/b\u003e to Georgia in May.\u003cbr\u003e\u003cspan class=\"tr\"\u003eПредлагаю поехать в Грузию в мае.\u003c/span\u003e\u003cbr\u003eMy friend suggested \u003cb\u003ewatching\u003c/b\u003e a detective series tonight.\u003cbr\u003e\u003cspan class=\"tr\"\u003eДруг предложил посмотреть детективный сериал вечером.\u003c/span\u003e\u003cbr\u003eI suggest \u003cb\u003enot booking\u003c/b\u003e the hotel yet.\u003cbr\u003e\u003cspan class=\"tr\"\u003eПредлагаю пока не бронировать отель. (отрицание: not + -ing)\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003emind\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eбыть против\u003c/td\u003e\u003ctd class=\"en\"\u003eDo you mind \u003cb\u003ewaiting\u003c/b\u003e five minutes?\u003cbr\u003e\u003cspan class=\"tr\"\u003eТы не против подождать пять минут?\u003c/span\u003e\u003cbr\u003eI don\u0027t mind \u003cb\u003ecooking\u003c/b\u003e tonight.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ не против приготовить ужин сегодня.\u003c/span\u003e\u003cbr\u003eWould you mind \u003cb\u003eclosing\u003c/b\u003e the window?\u003cbr\u003e\u003cspan class=\"tr\"\u003eНе могли бы вы закрыть окно? (вежливая просьба)\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eenjoy\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eполучать удовольствие, любить делать\u003c/td\u003e\u003ctd class=\"en\"\u003eI enjoy \u003cb\u003esewing\u003c/b\u003e in the evenings.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ люблю шить по вечерам.\u003c/span\u003e\u003cbr\u003eWe enjoyed \u003cb\u003ewalking\u003c/b\u003e along the river.\u003cbr\u003e\u003cspan class=\"tr\"\u003eНам понравилось гулять вдоль реки.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eavoid\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eизбегать, стараться не\u003c/td\u003e\u003ctd class=\"en\"\u003eI avoid \u003cb\u003eflying\u003c/b\u003e at night.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ стараюсь не летать ночью.\u003c/span\u003e\u003cbr\u003eHe avoided \u003cb\u003eanswering\u003c/b\u003e my question.\u003cbr\u003e\u003cspan class=\"tr\"\u003eОн ушёл от ответа на мой вопрос.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003efinish\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eзакончить\u003c/td\u003e\u003ctd class=\"en\"\u003eHave you finished \u003cb\u003epacking\u003c/b\u003e?\u003cbr\u003e\u003cspan class=\"tr\"\u003eТы закончила собирать вещи?\u003c/span\u003e\u003cbr\u003eI finished \u003cb\u003eworking\u003c/b\u003e at 7 p.m.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ закончил работать в 7 вечера.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edeny\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eотрицать\u003c/td\u003e\u003ctd class=\"en\"\u003eHe denied \u003cb\u003eeating\u003c/b\u003e my chocolate.\u003cbr\u003e\u003cspan class=\"tr\"\u003eОн отрицал, что съел мой шоколад.\u003c/span\u003e\u003cbr\u003eShe denied \u003cb\u003ebreaking\u003c/b\u003e the vase.\u003cbr\u003e\u003cspan class=\"tr\"\u003eОна отрицала, что разбила вазу.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elook forward to\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eс нетерпением ждать\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027m looking forward to \u003cb\u003eseeing\u003c/b\u003e you.\u003cbr\u003e\u003cspan class=\"tr\"\u003eС нетерпением жду встречи с тобой.\u003c/span\u003e\u003cbr\u003eWe\u0027re looking forward to \u003cb\u003egoing\u003c/b\u003e to Canada.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы очень ждём поездки в Канаду.\u003c/span\u003e\u003cbr\u003eI look forward to \u003cb\u003ehearing\u003c/b\u003e from you.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЖду вашего ответа. (концовка рабочего письма)\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch3\u003eЧастые ошибки\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eТак нельзя\u003c/th\u003e\u003cth\u003eПравильно\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI suggest to meet next week.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI suggest meeting next week.\u003c/td\u003e\u003ctd\u003eПосле suggest — -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHe suggested me to stay.\u003c/td\u003e\u003ctd class=\"en v\"\u003eHe suggested (that) I stay.\u003cbr\u003eHe suggested staying.\u003c/td\u003e\u003ctd\u003eС suggest нельзя «suggest me to». Можно через that или просто -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWould you mind to meet?\u003c/td\u003e\u003ctd class=\"en v\"\u003eWould you mind meeting?\u003c/td\u003e\u003ctd\u003eПосле mind — -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI\u0027m looking forward to see you.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI\u0027m looking forward to seeing you.\u003c/td\u003e\u003ctd\u003eЗдесь to — предлог (как «к» в «стремлюсь к»), поэтому дальше -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI enjoy to cook.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI enjoy cooking.\u003c/td\u003e\u003ctd\u003eПосле enjoy — -ing\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eКак отвечать на «Do you mind…?»\u003c/b\u003e Вопрос звучит как «Ты против?», поэтому согласие — это «нет»:\u003cbr\u003e\n\u003cspan class=\"en\"\u003e— Do you mind if I open the window? — \u003cb\u003eNo, not at all.\u003c/b\u003e / \u003cb\u003eNo, go ahead.\u003c/b\u003e\u003c/span\u003e → Не против, открывай.\u003cbr\u003e\n\u003cspan class=\"en\"\u003e— \u003cb\u003eYes, I do\u003c/b\u003e, actually. I\u0027m cold.\u003c/span\u003e → Против: мне холодно.\u003c/div\u003e\n\n\u003ch2\u003e5. Ваши ошибки из урока 1\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eКак сказали\u003c/th\u003e\u003cth\u003eКак правильно\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWhen did you saw…?\u003c/td\u003e\u003ctd class=\"en v\"\u003eWhen did you see…?\u003c/td\u003e\u003ctd\u003eПосле did глагол всегда в первой форме\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI have been in Ukraine when I was a child.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI was in Ukraine when I was a child.\u003c/td\u003e\u003ctd\u003eЕсть «when I was a child» — время названо, нужен past simple\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHave you ever been in Ukraine?\u003c/td\u003e\u003ctd class=\"en v\"\u003eHave you ever been to Ukraine?\u003c/td\u003e\u003ctd\u003e«Съездить, побывать» — been \u003cb\u003eto\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003ethe biggest waterfall which I saw\u003c/td\u003e\u003ctd class=\"en v\"\u003ethe biggest waterfall I\u0027ve ever seen\u003c/td\u003e\u003ctd\u003e«Самый… за всю жизнь» → present perfect + ever\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003ein the first time\u003c/td\u003e\u003ctd class=\"en v\"\u003efor the first time\u003c/td\u003e\u003ctd\u003eУстойчивое выражение «впервые»\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eonly one in my life\u003c/td\u003e\u003ctd class=\"en v\"\u003eonly once in my life\u003c/td\u003e\u003ctd\u003eОдин раз — once, два — twice, три — three times\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWe discussed about trips.\u003c/td\u003e\u003ctd class=\"en v\"\u003eWe discussed trips.\u003c/td\u003e\u003ctd\u003eПосле discuss не нужно about (но: we talked about)\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eThere was a lot of people. · I were\u003c/td\u003e\u003ctd class=\"en v\"\u003eThere were a lot of people. · I was\u003c/td\u003e\u003ctd\u003ePeople — множественное число; с I всегда was\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHe think…\u003c/td\u003e\u003ctd class=\"en v\"\u003eHe thinks…\u003c/td\u003e\u003ctd\u003eHe, she, it → глагол с -s\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI am living here since 2019.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI have lived here since 2019.\u003c/td\u003e\u003ctd\u003eС since — present perfect, хотя по-русски «живу»\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2 class=\"page\"\u003e6. Слова урока 1\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:22%\"\u003eСлово\u003c/th\u003e\u003cth style=\"width:30%\"\u003eПеревод\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eset off\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eотправиться в путь\u003c/td\u003e\u003ctd class=\"en\"\u003eWe set off at 5 a.m.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003echeck in\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзаселиться в отель, зарегистрироваться на рейс\u003c/td\u003e\u003ctd class=\"en\"\u003eWe checked in at 3 p.m.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eget around\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпередвигаться по городу\u003c/td\u003e\u003ctd class=\"en\"\u003eWe got around by tram.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eend up\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eв итоге оказаться\u003c/td\u003e\u003ctd class=\"en\"\u003eWe ended up in a tiny café.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elook around\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eосмотреться, побродить\u003c/td\u003e\u003ctd class=\"en\"\u003eLet\u0027s look around the old town.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003erun out of\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзакончиться (о деньгах, времени)\u003c/td\u003e\u003ctd class=\"en\"\u003eWe ran out of money on day five.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ebook in advance\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзабронировать заранее\u003c/td\u003e\u003ctd class=\"en\"\u003eI booked the tickets in advance.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edelayed\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзадержан (о рейсе)\u003c/td\u003e\u003ctd class=\"en\"\u003eOur flight was delayed for two hours.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ejet lag\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eджетлаг, сбой после перелёта\u003c/td\u003e\u003ctd class=\"en\"\u003eI had terrible jet lag.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ebreathtaking\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзахватывающий дух\u003c/td\u003e\u003ctd class=\"en\"\u003eThe view was breathtaking.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003ch3\u003eСлова, на которых вы ошиблись (повторить)\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:22%\"\u003eСлово\u003c/th\u003e\u003cth style=\"width:30%\"\u003eПеревод\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eput off\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eотложить, перенести\u003c/td\u003e\u003ctd class=\"en\"\u003eLet\u0027s put off the meeting until Friday.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eI\u0027m broke\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eу меня нет денег (разг.)\u003c/td\u003e\u003ctd class=\"en\"\u003eI can\u0027t go out tonight, I\u0027m broke.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003emiss\u003c/b\u003e the bus\u003c/td\u003e\u003ctd\u003eопоздать на автобус\u003c/td\u003e\u003ctd class=\"en\"\u003eShe missed the bus and was late.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edo\u003c/b\u003e a favour\u003c/td\u003e\u003ctd\u003eсделать одолжение\u003c/td\u003e\u003ctd class=\"en\"\u003eCan you do me a favour?\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eafford\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпозволить себе (по деньгам)\u003c/td\u003e\u003ctd class=\"en\"\u003eWe can\u0027t afford a flat yet.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eamazed\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпоражённый, восхищённый\u003c/td\u003e\u003ctd class=\"en\"\u003eWe were amazed by the old city in the mountains.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ecuisine\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eкухня (еда страны)\u003c/td\u003e\u003ctd class=\"en\"\u003eGeorgian cuisine is delicious.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elive\u003c/b\u003e [лив] / \u003cb\u003eleave\u003c/b\u003e [лиив]\u003c/td\u003e\u003ctd\u003eжить / уезжать, оставлять\u003c/td\u003e\u003ctd class=\"en\"\u003eWe live in Italy. We leave tomorrow.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eonce\u003c/b\u003e / \u003cb\u003etwice\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eодин раз / два раза\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027ve been there once.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003efor the first time\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eвпервые\u003c/td\u003e\u003ctd class=\"en\"\u003eI travelled alone for the first time at 19.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp class=\"small\"\u003eПроизношение и больше примеров — в словаре Cambridge: dictionary.cambridge.org\u003c/p\u003e\n"}];

let voice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB)/i.test(v.lang));
  const r=v=>/samantha|natural|google us/i.test(v.name)?0:/online|google|daniel|karen/i.test(v.name)?1:2; voice=vs.sort((a,b)=>r(a)-r(b))[0]||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
/* iPhone Safari quirks: speech must first be started from a tap (we "unlock" it on the first touch),
   speak() right after cancel() is often dropped, and the utterance must stay referenced or it can be lost. */
let ttsUnlocked=false, curUtt=null, sayTimer=null;
function unlockTTS(){ if(ttsUnlocked || !('speechSynthesis' in window)) return; ttsUnlocked=true;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='en-US'; speechSynthesis.speak(u); }catch(e){} }
['touchend','click'].forEach(ev=>document.addEventListener(ev, unlockTTS, {passive:true}));
function say(t, slow){
  if(!('speechSynthesis' in window)){ toast('Этот браузер не умеет озвучивать слова. Откройте в Safari или Chrome.'); return; }
  const go=()=>{
    try{
      speechSynthesis.resume();
      const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=slow?0.7:0.95; if(voice) u.voice=voice;
      let started=false;
      u.onstart=()=>{ started=true; toast(''); };
      u.onerror=e=>{ if(!['interrupted','canceled'].includes(e.error)) toast('Озвучка не сработала. Проверьте, что звук включён.'); };
      curUtt=u; speechSynthesis.speak(u);
      clearTimeout(sayTimer);
      sayTimer=setTimeout(()=>{ if(!started) toast('Не слышно? Выключите режим «Без звука» (переключатель сбоку iPhone) и прибавьте громкость.'); },2500);
    }catch(e){ toast('Озвучка не сработала.'); }
  };
  if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,80); } else go();
}
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.hidden=!msg;
  clearTimeout(el._t); if(msg) el._t=setTimeout(()=>{ el.hidden=true; },6000);
}

let actx=null;
function beep(ok){ try{ actx ||= new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); const t=actx.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type=ok?'sine':'triangle';
    g.gain.setValueAtTime(0.0001,t+i*0.09); g.gain.exponentialRampToValueAtTime(0.18,t+i*0.09+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.09+0.16);
    o.connect(g).connect(actx.destination); o.start(t+i*0.09); o.stop(t+i*0.09+0.18); }); }catch(e){} }

/* One stack of topics, newest lesson first. Each lesson starts with a divider; every topic carries its lesson tag. */
function topicsHtml(html, tag){
  const box=document.createElement('div'); box.innerHTML=html;
  const out=document.createElement('div'); let cur=null;
  [...box.childNodes].forEach(n=>{
    if(n.nodeType===1 && n.tagName==='H2'){
      cur=document.createElement('details'); cur.className='topic';
      const s=document.createElement('summary');
      const t=document.createElement('span'); t.className='tag'; t.textContent=tag;
      const title=document.createElement('span'); title.textContent=n.textContent.replace(/^\s*\d+\.\s*/,'');
      s.appendChild(t); s.appendChild(title); cur.appendChild(s); out.appendChild(cur); return; }
    if(n.nodeType===1 && n.tagName==='TABLE'){ const w=document.createElement('div'); w.className='tbl'; w.appendChild(n); n=w; }
    if(cur) cur.appendChild(n);
  });
  return out.innerHTML;
}

function rulesFilter(q){
