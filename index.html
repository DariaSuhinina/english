html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f);-webkit-text-size-adjust:100%;

button{font:inherit;color:inherit}

.new{align-self:center;background:var(--gold);color:#1c1300;font-weight:800;font-size:.75rem;letter-spacing:.08em;padding:3px 10px;border-radius:999px}

.page{display:flex;flex-direction:column;gap:14px;padding-top:24px}

.ansline{font-size:.92rem} .ansline.good{color:var(--ok)} .ansline.bad{color:var(--bad)}

.medialink{display:block;border:2px solid var(--accent);border-radius:12px;padding:12px;color:var(--accent);text-decoration:none;font-weight:700;background:var(--accent-soft)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const RULES_HTML="\n\n\n\n\n\u003ch2\u003e1. Present perfect или past simple\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:18%\"\u003e\u003c/th\u003e\u003cth\u003ePresent perfect\u003c/th\u003e\u003cth\u003ePast simple\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eКак строится\u003c/td\u003e\u003ctd class=\"en\"\u003ehave / has + 3-я форма глагола (V3)\u003cbr\u003eI \u003cb\u003ehave seen\u003c/b\u003e · she \u003cb\u003ehas been\u003c/b\u003e · we \u003cb\u003ehave booked\u003c/b\u003e\u003c/td\u003e\u003ctd class=\"en\"\u003e2-я форма (V2), в вопросе и отрицании did\u003cbr\u003eI \u003cb\u003esaw\u003c/b\u003e · she \u003cb\u003ewas\u003c/b\u003e · \u003cb\u003edid\u003c/b\u003e you \u003cb\u003esee\u003c/b\u003e? · I \u003cb\u003edidn\u0027t see\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eСлова-подсказки\u003c/td\u003e\u003ctd class=\"en\"\u003eever, never, just, already, yet, so far, for, since, this year / this week / today (если период ещё идёт)\u003c/td\u003e\u003ctd class=\"en\"\u003eyesterday, last week, last year, … ago, in 2023, in March, when I was a child\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eВопрос\u003c/td\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eHave\u003c/b\u003e you ever \u003cb\u003ebeen\u003c/b\u003e to Canada?\u003cbr\u003eHow long \u003cb\u003ehave\u003c/b\u003e you \u003cb\u003eknown\u003c/b\u003e each other?\u003c/td\u003e\u003ctd class=\"en\"\u003eWhen \u003cb\u003edid\u003c/b\u003e you \u003cb\u003ego\u003c/b\u003e to Canada?\u003cbr\u003eHow long \u003cb\u003edid\u003c/b\u003e you \u003cb\u003estay\u003c/b\u003e there?\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch3\u003eКогда какое время\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:30%\"\u003eСитуация\u003c/th\u003e\u003cth style=\"width:15%\"\u003eВремя\u003c/th\u003e\u003cth\u003eПример и перевод\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eГоворим, что такое было в жизни, но не говорим когда\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave been\u003c/b\u003e to Turkey.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ была в Турции (когда-то, неважно когда).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eГоворим, когда именно это было\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ewent\u003c/b\u003e to Turkey last year.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ ездила в Турцию в прошлом году.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eНачалось в прошлом и продолжается сейчас. По-русски здесь настоящее время: «живу с…», «знаю уже…»\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave lived\u003c/b\u003e in Italy since 2022.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ живу в Италии с 2022 года (и сейчас живу).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eБыло и закончилось, сейчас уже не так\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003elived\u003c/b\u003e in Germany for two years.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ жил в Германии два года (сейчас уже не живу).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eЧто-то случилось, и результат виден сейчас\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave lost\u003c/b\u003e my keys.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ потерял ключи (и до сих пор не нашёл).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eРассказываем историю: что было сначала, что потом\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eWe \u003cb\u003earrived\u003c/b\u003e, \u003cb\u003echecked in\u003c/b\u003e and \u003cb\u003ewent\u003c/b\u003e to the beach.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы приехали, заселились и пошли на пляж.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e«Самый… за всю жизнь»\u003c/td\u003e\u003ctd\u003ePresent perfect + ever\u003c/td\u003e\u003ctd class=\"en\"\u003eIt\u0027s the most beautiful waterfall I\u003cb\u003e\u0027ve ever seen\u003c/b\u003e.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЭто самый красивый водопад, который я видела.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eПростое правило.\u003c/b\u003e Если в предложении есть yesterday, last…, … ago, in 2023, when I was… или ясно, когда это было, ставим \u003cb\u003epast simple\u003c/b\u003e. Если даты нет, а важно «было в жизни» или «до сих пор», ставим \u003cb\u003epresent perfect\u003c/b\u003e.\u003c/div\u003e\n\n\u003ch3\u003eThis year, today, this week: незаконченный период\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eПериод\u003c/th\u003e\u003cth\u003eЗакончился?\u003c/th\u003e\u003cth\u003eВремя\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003ethis year, this month, this week, today\u003c/td\u003e\u003ctd\u003eНет, ещё идёт\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave been\u003c/b\u003e to Rome twice this year.\u003cbr\u003e\u003cspan class=\"tr\"\u003eВ этом году я уже дважды была в Риме (год ещё не кончился).\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003elast year, yesterday, in 2023\u003c/td\u003e\u003ctd\u003eДа\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ewent\u003c/b\u003e to Rome last year.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003ethis morning, если сейчас вечер\u003c/td\u003e\u003ctd\u003eДа, утро прошло\u003c/td\u003e\u003ctd\u003ePast simple\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003edrank\u003c/b\u003e too much coffee this morning.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003ethis morning, если сейчас ещё утро\u003c/td\u003e\u003ctd\u003eНет\u003c/td\u003e\u003ctd\u003ePresent perfect\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehave drunk\u003c/b\u003e three coffees this morning.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp\u003eЕсли внутри незаконченного года назвать конкретный момент, снова нужен past simple: \u003cspan class=\"en\"\u003eI \u003cb\u003ewent\u003c/b\u003e to Rome \u003cb\u003ein March\u003c/b\u003e.\u003c/span\u003e\u003c/p\u003e\n\n\u003ch2\u003e2. For, since, during\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:18%\"\u003e\u003c/th\u003e\u003cth\u003efor\u003c/th\u003e\u003cth\u003esince\u003c/th\u003e\u003cth\u003eduring\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eОтвечает на вопрос\u003c/td\u003e\u003ctd\u003e\u003cb\u003eКак долго?\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003eС какого момента?\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003eКогда? Во время чего?\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eЧто идёт после\u003c/td\u003e\u003ctd\u003eчисло + время\u003cbr\u003e\u003cspan class=\"en\"\u003efor two hours, for three years, for a long time\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eточка начала\u003cbr\u003e\u003cspan class=\"en\"\u003esince 2019, since Monday, since I was 15\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eсобытие или период без чисел\u003cbr\u003e\u003cspan class=\"en\"\u003eduring the trip, during the film, during the summer\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eПример\u003c/td\u003e\u003ctd class=\"en\"\u003eWe\u0027ve been married \u003cb\u003efor\u003c/b\u003e two years.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы женаты уже два года.\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"en\"\u003eWe\u0027ve been married \u003cb\u003esince\u003c/b\u003e 2024.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы женаты с 2024 года.\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"en\"\u003eWe met nice people \u003cb\u003eduring\u003c/b\u003e the trip.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы встретили приятных людей во время поездки.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp\u003eВместе в одном предложении: \u003cspan class=\"en\"\u003eI slept \u003cb\u003efor two hours\u003c/b\u003e \u003cb\u003eduring the flight\u003c/b\u003e.\u003c/span\u003e \u003cspan class=\"tr\"\u003e«Два часа» отвечает на вопрос «сколько?», «во время перелёта» — на вопрос «когда?».\u003c/span\u003e\u003c/p\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eПроверка.\u003c/b\u003e По-русски «в течение трёх лет», но по-английски \u003cspan class=\"x\"\u003eduring three years\u003c/span\u003e → \u003cspan class=\"v\"\u003efor three years\u003c/span\u003e: после during не бывает чисел.\u003c/div\u003e\n\n\u003ch2\u003e3. Вопросы «как долго» и «когда последний раз»\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eЧто хотим спросить\u003c/th\u003e\u003cth\u003eКак сказать\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eСколько ты уже живёшь в Италии? (и сейчас живёшь)\u003c/td\u003e\u003ctd class=\"en\"\u003eHow long \u003cb\u003ehave\u003c/b\u003e you \u003cb\u003elived\u003c/b\u003e in Italy?\u003c/td\u003e\u003ctd\u003eПродолжается до сих пор → present perfect\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eСколько ты пробыл в Грузии в прошлом году?\u003c/td\u003e\u003ctd class=\"en\"\u003eHow long \u003cb\u003edid\u003c/b\u003e you \u003cb\u003estay\u003c/b\u003e in Georgia last year?\u003c/td\u003e\u003ctd\u003eЗакончилось → past simple. О поездке — stay, а не live\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eКак долго ты не был в отпуске?\u003c/td\u003e\u003ctd class=\"en\"\u003eHow long \u003cb\u003ehas it been since\u003c/b\u003e your last vacation?\u003cbr\u003eWhen \u003cb\u003ewas\u003c/b\u003e your last vacation?\u003c/td\u003e\u003ctd\u003e«Как долго не…» по-английски не спрашивают. Говорят: «сколько прошло с…»\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eЯ не был в отпуске два года.\u003c/td\u003e\u003ctd class=\"en\"\u003eI \u003cb\u003ehaven\u0027t been\u003c/b\u003e on vacation for two years.\u003c/td\u003e\u003ctd\u003eВ утверждении отрицание нормально. В отпуске — \u003cb\u003eon\u003c/b\u003e vacation / \u003cb\u003eon\u003c/b\u003e holiday\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2 class=\"page\"\u003e4. Ошибка недели: глагол + -ing\u003c/h2\u003e\n\u003cp\u003eПосле этих глаголов второй глагол ставим с \u003cb\u003e-ing\u003c/b\u003e, хотя по-русски там «встретиться», «готовить», «лететь». Правила тут нет, их просто нужно запомнить.\u003c/p\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:17%\"\u003eГлагол\u003c/th\u003e\u003cth style=\"width:16%\"\u003eЗначение\u003c/th\u003e\u003cth\u003eПримеры\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003esuggest\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eпредлагать\u003c/td\u003e\u003ctd class=\"en\"\u003eI suggest \u003cb\u003egoing\u003c/b\u003e to Georgia in May.\u003cbr\u003e\u003cspan class=\"tr\"\u003eПредлагаю поехать в Грузию в мае.\u003c/span\u003e\u003cbr\u003eMy friend suggested \u003cb\u003ewatching\u003c/b\u003e a detective series tonight.\u003cbr\u003e\u003cspan class=\"tr\"\u003eДруг предложил посмотреть детективный сериал вечером.\u003c/span\u003e\u003cbr\u003eI suggest \u003cb\u003enot booking\u003c/b\u003e the hotel yet.\u003cbr\u003e\u003cspan class=\"tr\"\u003eПредлагаю пока не бронировать отель. (отрицание: not + -ing)\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003emind\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eбыть против\u003c/td\u003e\u003ctd class=\"en\"\u003eDo you mind \u003cb\u003ewaiting\u003c/b\u003e five minutes?\u003cbr\u003e\u003cspan class=\"tr\"\u003eТы не против подождать пять минут?\u003c/span\u003e\u003cbr\u003eI don\u0027t mind \u003cb\u003ecooking\u003c/b\u003e tonight.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ не против приготовить ужин сегодня.\u003c/span\u003e\u003cbr\u003eWould you mind \u003cb\u003eclosing\u003c/b\u003e the window?\u003cbr\u003e\u003cspan class=\"tr\"\u003eНе могли бы вы закрыть окно? (вежливая просьба)\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eenjoy\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eполучать удовольствие, любить делать\u003c/td\u003e\u003ctd class=\"en\"\u003eI enjoy \u003cb\u003esewing\u003c/b\u003e in the evenings.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ люблю шить по вечерам.\u003c/span\u003e\u003cbr\u003eWe enjoyed \u003cb\u003ewalking\u003c/b\u003e along the river.\u003cbr\u003e\u003cspan class=\"tr\"\u003eНам понравилось гулять вдоль реки.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eavoid\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eизбегать, стараться не\u003c/td\u003e\u003ctd class=\"en\"\u003eI avoid \u003cb\u003eflying\u003c/b\u003e at night.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ стараюсь не летать ночью.\u003c/span\u003e\u003cbr\u003eHe avoided \u003cb\u003eanswering\u003c/b\u003e my question.\u003cbr\u003e\u003cspan class=\"tr\"\u003eОн ушёл от ответа на мой вопрос.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003efinish\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eзакончить\u003c/td\u003e\u003ctd class=\"en\"\u003eHave you finished \u003cb\u003epacking\u003c/b\u003e?\u003cbr\u003e\u003cspan class=\"tr\"\u003eТы закончила собирать вещи?\u003c/span\u003e\u003cbr\u003eI finished \u003cb\u003eworking\u003c/b\u003e at 7 p.m.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЯ закончил работать в 7 вечера.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edeny\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eотрицать\u003c/td\u003e\u003ctd class=\"en\"\u003eHe denied \u003cb\u003eeating\u003c/b\u003e my chocolate.\u003cbr\u003e\u003cspan class=\"tr\"\u003eОн отрицал, что съел мой шоколад.\u003c/span\u003e\u003cbr\u003eShe denied \u003cb\u003ebreaking\u003c/b\u003e the vase.\u003cbr\u003e\u003cspan class=\"tr\"\u003eОна отрицала, что разбила вазу.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elook forward to\u003c/b\u003e + -ing\u003c/td\u003e\u003ctd\u003eс нетерпением ждать\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027m looking forward to \u003cb\u003eseeing\u003c/b\u003e you.\u003cbr\u003e\u003cspan class=\"tr\"\u003eС нетерпением жду встречи с тобой.\u003c/span\u003e\u003cbr\u003eWe\u0027re looking forward to \u003cb\u003egoing\u003c/b\u003e to Canada.\u003cbr\u003e\u003cspan class=\"tr\"\u003eМы очень ждём поездки в Канаду.\u003c/span\u003e\u003cbr\u003eI look forward to \u003cb\u003ehearing\u003c/b\u003e from you.\u003cbr\u003e\u003cspan class=\"tr\"\u003eЖду вашего ответа. (концовка рабочего письма)\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch3\u003eЧастые ошибки\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eТак нельзя\u003c/th\u003e\u003cth\u003eПравильно\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI suggest to meet next week.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI suggest meeting next week.\u003c/td\u003e\u003ctd\u003eПосле suggest — -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHe suggested me to stay.\u003c/td\u003e\u003ctd class=\"en v\"\u003eHe suggested (that) I stay.\u003cbr\u003eHe suggested staying.\u003c/td\u003e\u003ctd\u003eС suggest нельзя «suggest me to». Можно через that или просто -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWould you mind to meet?\u003c/td\u003e\u003ctd class=\"en v\"\u003eWould you mind meeting?\u003c/td\u003e\u003ctd\u003eПосле mind — -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI\u0027m looking forward to see you.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI\u0027m looking forward to seeing you.\u003c/td\u003e\u003ctd\u003eЗдесь to — предлог (как «к» в «стремлюсь к»), поэтому дальше -ing\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI enjoy to cook.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI enjoy cooking.\u003c/td\u003e\u003ctd\u003eПосле enjoy — -ing\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cdiv class=\"rule\"\u003e\u003cb\u003eКак отвечать на «Do you mind…?»\u003c/b\u003e Вопрос звучит как «Ты против?», поэтому согласие — это «нет»:\u003cbr\u003e\n\u003cspan class=\"en\"\u003e— Do you mind if I open the window? — \u003cb\u003eNo, not at all.\u003c/b\u003e / \u003cb\u003eNo, go ahead.\u003c/b\u003e\u003c/span\u003e → Не против, открывай.\u003cbr\u003e\n\u003cspan class=\"en\"\u003e— \u003cb\u003eYes, I do\u003c/b\u003e, actually. I\u0027m cold.\u003c/span\u003e → Против: мне холодно.\u003c/div\u003e\n\n\u003ch2\u003e5. Ваши ошибки из урока 1\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth\u003eКак сказали\u003c/th\u003e\u003cth\u003eКак правильно\u003c/th\u003e\u003cth\u003eПочему\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWhen did you saw…?\u003c/td\u003e\u003ctd class=\"en v\"\u003eWhen did you see…?\u003c/td\u003e\u003ctd\u003eПосле did глагол всегда в первой форме\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI have been in Ukraine when I was a child.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI was in Ukraine when I was a child.\u003c/td\u003e\u003ctd\u003eЕсть «when I was a child» — время названо, нужен past simple\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHave you ever been in Ukraine?\u003c/td\u003e\u003ctd class=\"en v\"\u003eHave you ever been to Ukraine?\u003c/td\u003e\u003ctd\u003e«Съездить, побывать» — been \u003cb\u003eto\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003ethe biggest waterfall which I saw\u003c/td\u003e\u003ctd class=\"en v\"\u003ethe biggest waterfall I\u0027ve ever seen\u003c/td\u003e\u003ctd\u003e«Самый… за всю жизнь» → present perfect + ever\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003ein the first time\u003c/td\u003e\u003ctd class=\"en v\"\u003efor the first time\u003c/td\u003e\u003ctd\u003eУстойчивое выражение «впервые»\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eonly one in my life\u003c/td\u003e\u003ctd class=\"en v\"\u003eonly once in my life\u003c/td\u003e\u003ctd\u003eОдин раз — once, два — twice, три — three times\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eWe discussed about trips.\u003c/td\u003e\u003ctd class=\"en v\"\u003eWe discussed trips.\u003c/td\u003e\u003ctd\u003eПосле discuss не нужно about (но: we talked about)\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eThere was a lot of people. · I were\u003c/td\u003e\u003ctd class=\"en v\"\u003eThere were a lot of people. · I was\u003c/td\u003e\u003ctd\u003ePeople — множественное число; с I всегда was\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eHe think…\u003c/td\u003e\u003ctd class=\"en v\"\u003eHe thinks…\u003c/td\u003e\u003ctd\u003eHe, she, it → глагол с -s\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en x\"\u003eI am living here since 2019.\u003c/td\u003e\u003ctd class=\"en v\"\u003eI have lived here since 2019.\u003c/td\u003e\u003ctd\u003eС since — present perfect, хотя по-русски «живу»\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\n\u003ch2 class=\"page\"\u003e6. Слова недели\u003c/h2\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:22%\"\u003eСлово\u003c/th\u003e\u003cth style=\"width:30%\"\u003eПеревод\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eset off\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eотправиться в путь\u003c/td\u003e\u003ctd class=\"en\"\u003eWe set off at 5 a.m.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003echeck in\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзаселиться в отель, зарегистрироваться на рейс\u003c/td\u003e\u003ctd class=\"en\"\u003eWe checked in at 3 p.m.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eget around\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпередвигаться по городу\u003c/td\u003e\u003ctd class=\"en\"\u003eWe got around by tram.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eend up\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eв итоге оказаться\u003c/td\u003e\u003ctd class=\"en\"\u003eWe ended up in a tiny café.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elook around\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eосмотреться, побродить\u003c/td\u003e\u003ctd class=\"en\"\u003eLet\u0027s look around the old town.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003erun out of\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзакончиться (о деньгах, времени)\u003c/td\u003e\u003ctd class=\"en\"\u003eWe ran out of money on day five.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ebook in advance\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзабронировать заранее\u003c/td\u003e\u003ctd class=\"en\"\u003eI booked the tickets in advance.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edelayed\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзадержан (о рейсе)\u003c/td\u003e\u003ctd class=\"en\"\u003eOur flight was delayed for two hours.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ejet lag\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eджетлаг, сбой после перелёта\u003c/td\u003e\u003ctd class=\"en\"\u003eI had terrible jet lag.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ebreathtaking\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eзахватывающий дух\u003c/td\u003e\u003ctd class=\"en\"\u003eThe view was breathtaking.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003ch3\u003eСлова, на которых вы ошиблись (повторить)\u003c/h3\u003e\n\u003ctable\u003e\n\u003ctr\u003e\u003cth style=\"width:22%\"\u003eСлово\u003c/th\u003e\u003cth style=\"width:30%\"\u003eПеревод\u003c/th\u003e\u003cth\u003eПример\u003c/th\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eput off\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eотложить, перенести\u003c/td\u003e\u003ctd class=\"en\"\u003eLet\u0027s put off the meeting until Friday.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eI\u0027m broke\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eу меня нет денег (разг.)\u003c/td\u003e\u003ctd class=\"en\"\u003eI can\u0027t go out tonight, I\u0027m broke.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003emiss\u003c/b\u003e the bus\u003c/td\u003e\u003ctd\u003eопоздать на автобус\u003c/td\u003e\u003ctd class=\"en\"\u003eShe missed the bus and was late.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003edo\u003c/b\u003e a favour\u003c/td\u003e\u003ctd\u003eсделать одолжение\u003c/td\u003e\u003ctd class=\"en\"\u003eCan you do me a favour?\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eafford\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпозволить себе (по деньгам)\u003c/td\u003e\u003ctd class=\"en\"\u003eWe can\u0027t afford a flat yet.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eamazed\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eпоражённый, восхищённый\u003c/td\u003e\u003ctd class=\"en\"\u003eWe were amazed by the old city in the mountains.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003ecuisine\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eкухня (еда страны)\u003c/td\u003e\u003ctd class=\"en\"\u003eGeorgian cuisine is delicious.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003elive\u003c/b\u003e [лив] / \u003cb\u003eleave\u003c/b\u003e [лиив]\u003c/td\u003e\u003ctd\u003eжить / уезжать, оставлять\u003c/td\u003e\u003ctd class=\"en\"\u003eWe live in Italy. We leave tomorrow.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003eonce\u003c/b\u003e / \u003cb\u003etwice\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eодин раз / два раза\u003c/td\u003e\u003ctd class=\"en\"\u003eI\u0027ve been there once.\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd class=\"en\"\u003e\u003cb\u003efor the first time\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eвпервые\u003c/td\u003e\u003ctd class=\"en\"\u003eI travelled alone for the first time at 19.\u003c/td\u003e\u003c/tr\u003e\n\u003c/table\u003e\n\u003cp class=\"small\"\u003eПроизношение и больше примеров — в словаре Cambridge: dictionary.cambridge.org\u003c/p\u003e\n";

let voice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB)/i.test(v.lang));
  const r=v=>/samantha|natural|google us/i.test(v.name)?0:/online|google|daniel|karen/i.test(v.name)?1:2; voice=vs.sort((a,b)=>r(a)-r(b))[0]||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
/* iPhone Safari quirks: speech must first be started from a tap (we "unlock" it on the first touch),
   speak() right after cancel() is often dropped, and the utterance must stay referenced or it can be lost. */
let ttsUnlocked=false, curUtt=null, sayTimer=null;
function unlockTTS(){ if(ttsUnlocked || !('speechSynthesis' in window)) return; ttsUnlocked=true;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='en-US'; speechSynthesis.speak(u); }catch(e){} }
['touchend','click'].forEach(ev=>document.addEventListener(ev, unlockTTS, {passive:true}));
function say(t, slow){
  if(!('speechSynthesis' in window)){ toast('Этот браузер не умеет озвучивать слова. Откройте в Safari или Chrome.'); return; }
  const go=()=>{
    try{
      speechSynthesis.resume();
      const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=slow?0.7:0.95; if(voice) u.voice=voice;
      let started=false;
      u.onstart=()=>{ started=true; toast(''); };
      u.onerror=e=>{ if(!['interrupted','canceled'].includes(e.error)) toast('Озвучка не сработала. Проверьте, что звук включён.'); };
      curUtt=u; speechSynthesis.speak(u);
      clearTimeout(sayTimer);
      sayTimer=setTimeout(()=>{ if(!started) toast('Не слышно? Выключите режим «Без звука» (переключатель сбоку iPhone) и прибавьте громкость.'); },2500);
    }catch(e){ toast('Озвучка не сработала.'); }
  };
  if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,80); } else go();
}
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.hidden=!msg;
  clearTimeout(el._t); if(msg) el._t=setTimeout(()=>{ el.hidden=true; },6000);
}

let actx=null;
function beep(ok){ try{ actx ||= new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); const t=actx.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type=ok?'sine':'triangle';
    g.gain.setValueAtTime(0.0001,t+i*0.09); g.gain.exponentialRampToValueAtTime(0.18,t+i*0.09+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.09+0.16);
    o.connect(g).connect(actx.destination); o.start(t+i*0.09); o.stop(t+i*0.09+0.18); }); }catch(e){} }

      return `<section class="sec"><div class="sec-h"><h2>${esc(s.title)}</h2><span class="pill ${t.done===t.total?'done':''}">${t.done===t.total?`✓ ${t.ok}/${t.total}`:s.time}</span></div>
        ${s.intro?`<p class="small muted">${esc(s.intro)}</p>`:''}
        ${s.link?`<a class="medialink" href="${s.link.href}" target="_blank" rel="noopener">${esc(s.link.title)}<span>${esc(s.link.sub)}</span></a>`:''}
        ${hwItems(s.key).map((it,i)=>hwItemHtml(s.key,it,i)).join('')}
        ${s.extra?`<div class="hq"><div class="qt"><b>★</b>${esc(s.extra.q)}</div><textarea rows="2" data-hin="${s.extra.id}" autocapitalize="sentences" spellcheck="false">${esc((HW[s.extra.id]||{}).v||'')}</textarea></div>`:''}
      </section>`; }).join('')}
    <section class="sec"><h2>Готово?</h2>
      <button class="big" id="hwReport">Скопировать результаты</button>
      <textarea class="copybox" id="hwBox" readonly hidden></textarea>
      <p class="small muted">Вставьте в Telegram и отправьте, чтобы результаты дошли до Claude.</p>
      ${hwConfirm?`<div class="confirm"><span class="small">Стереть все ответы домашки?</span><button class="linkbtn" id="hwResetYes" style="color:var(--bad)">Да, стереть</button><button class="linkbtn" id="hwResetNo">Отмена</button></div>`:`<button class="linkbtn" id="hwReset" style="color:var(--muted)">Начать домашку заново</button>`}
    </section></div>${nav()}`;
}
function hwRerender(){ const y=window.scrollY; hwView(); window.scrollTo(0,y); }
function hwCheck(id, give){
  const [key,i]=id.split('.'); const it=hwItems(key)[+i]; const el=document.querySelector(`[data-hin="${id}"]`); const v=el?el.value:'';
  if(!give && !v.trim()) return;
  const ok=!give && it.a.split(' / ').some(x=>expand(x)===expand(v));
  HW[id]={v, ok}; hwSave(); beep(ok); hwRerender();
}
function hwReport(){
  const lines=['Домашка 1 · '+HW_VARIANTS[hwVar].name+' · '+new Date().toISOString().slice(0,10)];
  HW_SECTIONS.map(secMeta).forEach(s=>{ const t=hwScore(s.key); lines.push(`${s.title.replace(/^\d+ · /,'')}: ${t.ok} из ${t.total}${t.done<t.total?` (сделано ${t.done})`:''}`);
    hwItems(s.key).forEach((it,i)=>{ const a=HW[s.key+'.'+i]; if(!a) return;
      if((it.t==='gap'||it.t==='mc') && a.ok===false) lines.push(`  ✗ ${it.q} → ${it.t==='mc'?it.o[a.v]:(a.v||'—')}`);
      if(it.t==='tr' && a.v) lines.push(`  ${a.self===false?'✗':a.self?'✓':'?'} ${it.q} → ${a.v}`); }); });
  if(HW.era && HW.era.v) lines.push('Моя era: '+HW.era.v);
  const txt=lines.join('\n'); const box=document.getElementById('hwBox');
  const fb=()=>{ box.hidden=false; box.value=txt; box.focus(); box.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=>{ document.getElementById('hwReport').textContent='Скопировано ✓ Вставьте в Telegram'; }, fb); }catch(e){ fb(); }
}

/* =================== SESSION =================== */
let Q=[], qi=0, cur=null, answered=false, sessWords=[], sessWrong=new Set(), combo=0, sessXp=0, correctCount=0, totalCount=0;
const TYPES=[['en2ru','listen','ru2en'],['ru2en','listen','gap'],['gap','tiles','ru2en'],['tiles','type','gap'],['type','tiles','gap'],['type','tiles','listen']];
function buildSession(){
  const d=dayNo();
  let pick=dueWords().sort((a,b)=>ws(a.id).lvl-ws(b.id).lvl).slice(0,6);
  const nNew=Math.max(0,Math.min(4,8-pick.length));
  pick=pick.concat(newWords().slice(0,nNew));
  if(pick.length<5){ const rest=W.filter(w=>!pick.includes(w)&&ws(w.id).seen).sort((a,b)=>ws(a.id).lvl-ws(b.id).lvl); pick=pick.concat(rest.slice(0,6-pick.length)); }
  Object.keys(usedSent).forEach(k=>delete usedSent[k]);
  sessWords=pick; sessWrong=new Set(); combo=0; sessXp=0; correctCount=0; totalCount=0;
  const lead=[], rest=[];
  pick.forEach(w=>{
    const s=ws(w.id);
    if(!s.seen){ lead.push({t:'intro',w}); lead.push({t:'en2ru',w}); rest.push({t:pickN(['listen','ru2en','gap'],1)[0],w}); }
    else { pickN(TYPES[Math.min(s.lvl,5)],2).forEach(t=>rest.push({t,w})); }
  });
  Q=lead.concat(shuffle(rest));
  const pool=pick.length>=5?pick:W.filter(w=>ws(w.id).seen||pick.includes(w));
  if(pool.length>=4) Q.splice(Math.max(lead.length, Math.floor(Q.length*0.6)),0,{t:'match',ws:pickN(pool,Math.min(5,pool.length))});
  qi=0; next();
}
function exitSession(){ try{speechSynthesis.cancel()}catch(e){} TAB='words'; route(); }

function frame(inner, kind){
  const pct=Math.round(qi/(Q.length)*100);
  app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="Выйти">✕</button><div class="bar"><div style="width:${pct}%"></div></div><span class="combo">${combo>=3?'🔥'+combo:''}</span></div>
   <div class="ex"><span class="kind">${kind}</span>${inner}</div>
   <div class="foot" id="foot"><div class="in"><div id="fbArea"></div><button class="big" id="check" disabled>Проверить</button></div></div>`;
}
function next(){
  answered=false;
  if(qi>=Q.length) return finish();
  cur=Q[qi]; const w=cur.w;
  const others=n=>{ const same=W.filter(x=>x!==w && x.set===w.set); return pickN(same.length>=n?same:W.filter(x=>x!==w),n); };
  switch(cur.t){
    case 'intro':
      frame(`<div class="intro"><span class="new">НОВОЕ СЛОВО</span><span class="w">${esc(w.en)}</span><button class="spk huge" data-say="${esc(w.en)}" aria-label="Послушать">🔊</button><span class="tr">${esc(w.ru)}</span><span class="exm">${esc(w.ex)}</span><span class="small muted">${esc(w.exRu)}</span><a class="small" href="${CAMB(w.en)}" target="_blank" rel="noopener">Открыть в Cambridge ↗</a></div>`,'Запоминаем');
      ws(w.id).seen=true; save();
      setCheck('Понятно', false); say(w.en); break;
    case 'en2ru': cur.opts=shuffle([w,...others(3)]);
      frame(`<div class="prompt">${esc(w.en)}<button class="spk" data-say="${esc(w.en)}" aria-label="Послушать">🔊</button></div>${optsHtml(cur.opts.map(x=>x.ru))}`,'Выберите перевод'); say(w.en); break;
    case 'ru2en': cur.opts=shuffle([w,...others(3)]);
      frame(`<div class="prompt ru">${esc(w.ru)}</div>${optsHtml(cur.opts.map(x=>x.en))}`,'Как это по-английски?'); break;
    case 'listen': cur.opts=shuffle([w,...others(3)]);
      frame(`<button class="spk huge" data-say="${esc(w.en)}" aria-label="Послушать ещё раз">🔊</button><button class="linkbtn" data-slow="${esc(w.en)}" style="align-self:center">🐢 медленнее</button>${optsHtml(cur.opts.map(x=>x.ru))}`,'Послушайте и выберите перевод'); setTimeout(()=>say(w.en),250); break;
    case 'gap': { const s=cur.s||(cur.s=pickSent(w));
      cur.opts=shuffle(s.traps ? [w,...s.traps.map(f=>({trap:true,form:f})),others(1)[0]] : [w,...others(3)]);
      frame(`<div class="gapline">${esc(s.gap).replace(/___/g,'<span class="blank"></span>')}</div><div class="sub small">${esc(s.exRu)}</div>${optsHtml(cur.opts.map(x=>x===w?s.form:formOf(x)))}`,'Вставьте пропущенное'); break; }
    case 'tiles': { const s=cur.s||(cur.s=pickSent(w));
      const toks=s.ex.split(' '); cur.toks=toks; cur.pool=shuffle(toks.map((t,i)=>({t,i}))); cur.ans=[];
      frame(`<div class="prompt ru">${esc(s.exRu)}</div><div class="answer" id="ans"></div><div class="pool" id="pool"></div>`,'Переведите: соберите предложение'); drawTiles(); break; }
    case 'type':
      frame(`<div class="prompt ru">${esc(w.ru)}</div><input class="typ" id="typ" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="по-английски"><div class="hint">${hintOf(w.en)}</div>`,'Напишите по-английски');
      setTimeout(()=>document.getElementById('typ')?.focus(),50); break;
    case 'match': {
      cur.left=shuffle(cur.ws); cur.right=shuffle(cur.ws); cur.done=new Set(); cur.sel=null; cur.miss=0;
      frame(`<div class="pairs" id="pairs"></div>`,'Найдите пары'); drawPairs();
      document.getElementById('check').hidden=true; break; }
  }
}
function formOf(x){ return x.form; }
function hintOf(en){ return en.split(' ').map(p=>p[0]+'_'.repeat(Math.max(0,p.length-1))).join('  '); }
function optsHtml(labels){ return `<div class="opts">${labels.map((l,i)=>`<button class="o" data-opt="${i}">${esc(l)}</button>`).join('')}</div>`; }
function setCheck(label, disabled){ const b=document.getElementById('check'); b.textContent=label; b.disabled=disabled; b.hidden=false; }

/* tiles */
function drawTiles(){
  document.getElementById('ans').innerHTML=cur.ans.map((p,k)=>`<button class="tile" data-back="${k}">${esc(p.t)}</button>`).join('');
  document.getElementById('pool').innerHTML=cur.pool.map((p,k)=>`<button class="tile ${cur.ans.includes(p)?'used':''}" data-take="${k}">${esc(p.t)}</button>`).join('');
  setCheck('Проверить', cur.ans.length===0);
}
/* pairs */
function drawPairs(){
  const cell=(w,side)=>`<button class="o ${cur.done.has(w.id)?'done':''} ${cur.sel&&cur.sel.side===side&&cur.sel.w===w?'sel':''}" data-pair="${side}:${w.id}" ${cur.done.has(w.id)?'disabled':''}>${esc(side==='l'?w.en:w.ru)}</button>`;
  document.getElementById('pairs').innerHTML=cur.left.map((w,i)=>cell(w,'l')+cell(cur.right[i],'r')).join('');
}

/* checking */
function check(){
  const w=cur.w; let ok=false, right='';
  if(cur.t==='intro'){ qi++; return next(); }
  if(['en2ru','ru2en','listen','gap'].includes(cur.t)){
    const sel=document.querySelector('.o.sel'); if(!sel) return;
    const i=+sel.dataset.opt; ok=cur.opts[i]===w;
    document.querySelectorAll('.o').forEach(b=>{ b.disabled=true; if(cur.opts[+b.dataset.opt]===w) b.classList.add('right'); });
    if(!ok) sel.classList.add('wrong');
    right = cur.t==='ru2en'?w.en : cur.t==='gap'? cur.s.ex : w.ru;
  }
  if(cur.t==='tiles'){
    const got=cur.ans.map(p=>p.t).join(' '); ok=norm(got)===norm(cur.s.ex); right=cur.s.ex;
  }
  if(cur.t==='type'){
    const v=document.getElementById('typ').value; if(!v.trim()) return;
    ok=[w.en,...w.acc].map(norm).includes(norm(v)); right=w.en;
    document.getElementById('typ').disabled=true;
  }
  grade(ok, right);
}
function grade(ok, right){
  answered=true; totalCount++;
  const w=cur.w, s=ws(w.id);
  if(ok){ combo++; correctCount++; const gain=10+(combo>=5?5:0); sessXp+=gain; s.right++; }
  else { combo=0; sessWrong.add(w.id); s.wrong++; if(!cur.retry) Q.push({...cur, retry:true, opts:undefined}); }
  beep(ok); save();
  const foot=document.getElementById('foot'); foot.classList.add(ok?'ok':'bad');
  /* gap/tiles show their own sentence; other types show another example of the word in use */
  const sn=cur.s||pickSent(w);
  const extra = ok ? `<div class="fbx">${esc(sn.ex)} — ${esc(sn.exRu)}</div>`
                   : (right===sn.ex ? `<div class="fbx">Правильно: <b>${esc(sn.ex)}</b> — ${esc(sn.exRu)}</div>`
                                    : `<div class="fbx">Правильно: <b>${esc(right)}</b></div><div class="fbx small">${esc(sn.ex)} — ${esc(sn.exRu)}</div>`);
  document.getElementById('fbArea').innerHTML=`<div class="fb">${ok?(combo>=3?`Верно! 🔥 ${combo} подряд`:'Верно!'):'Не совсем'}</div>${extra}`;
  setCheck('Дальше', false);
  document.querySelector('.combo').textContent=combo>=3?'🔥'+combo:'';
}
function finish(){
  const d=dayNo();
  sessWords.forEach(w=>{ const s=ws(w.id); s.seen=true;
    if(sessWrong.has(w.id)){ s.lvl=Math.max(0,s.lvl-1); s.due=d; }
    else { s.lvl=Math.min(5,s.lvl+1); s.due=d+INTERVAL[s.lvl]; } });
  if(S.lastDay!==d){ S.streak=(S.lastDay===d-1)?S.streak+1:1; S.lastDay=d; }
  S.xp+=sessXp; S.xpDay[d]=(S.xpDay[d]||0)+sessXp; S.sessions++;
  S.log.push({day:d, date:new Date().toISOString().slice(0,10), xp:sessXp, right:correctCount, total:totalCount, wrong:[...sessWrong]});
  if(S.log.length>200) S.log=S.log.slice(-200);
  save();
  const acc=totalCount?Math.round(correctCount/totalCount*100):100;
  app.innerHTML=`<div class="result"><div class="trophy">${acc>=90?'🏆':acc>=70?'💪':'📚'}</div><h1>Тренировка завершена</h1>
   <div class="stats"><div class="stat"><b>+${sessXp}</b><span>очков</span></div><div class="stat"><b>${acc}%</b><span>точность</span></div><div class="stat"><b>🔥 ${S.streak}</b><span>дней подряд</span></div></div>
   ${sessWrong.size?`<div class="card" style="text-align:left"><b>Повторить:</b> ${[...sessWrong].map(id=>`${esc(byId[id].en)} — ${esc(byId[id].ru)}`).join('; ')}</div>`:'<p class="muted">Без единой ошибки!</p>'}
   <button class="big" id="again">Ещё тренировка</button><button class="big ghost" id="toHome">На главную</button></div>`;
}

/* report for Claude */
function report(){
  const d=dayNo();
  const lines=W.map(w=>{const s=ws(w.id); return `${w.en}: уровень ${s.lvl}/5, верно ${s.right}, ошибок ${s.wrong}`;});
  const weak=W.filter(w=>ws(w.id).wrong>0).sort((a,b)=>ws(b.id).wrong-ws(a.id).wrong).slice(0,8).map(w=>w.en);
  const txt=`Тренажёр слов · ${new Date().toISOString().slice(0,10)}\nДней подряд: ${S.streak}, тренировок: ${S.sessions}, очков всего: ${S.xp}\nСложнее всего: ${weak.join(', ')||'—'}\n${lines.join('\n')}`;
  const box=document.getElementById('reportBox');
  const fb=()=>{ box.hidden=false; box.value=txt; box.focus(); box.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=>{ document.getElementById('report').textContent='Скопировано ✓ Вставьте в Telegram'; }, fb); }catch(e){ fb(); }
}

/* =================== EVENTS =================== */
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.say!==undefined){ say(b.dataset.say); return; }
  if(b.dataset.slow!==undefined){ say(b.dataset.slow,true); return; }
  switch(b.id){
    case 'go': case 'again': return buildSession();
    case 'toHome': case 'quit': return exitSession();
    case 'check': return answered? (qi++, next()) : check();
    case 'report': return report();
    case 'update': case 'updateTop': return manualUpdate(b);
    case 'reset': confirmReset=true; return home();
    case 'resetNo': confirmReset=false; return home();
    case 'resetYes': confirmReset=false; S=freshState(); save(); return home();
    case 'hwReport': return hwReport();
    case 'hwReset': hwConfirm=true; return hwRerender();
    case 'hwResetNo': hwConfirm=false; return hwRerender();
    case 'hwResetYes': hwConfirm=false; HW={}; hwSave(); return hwRerender();
  }
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.hvar){ setVariant(b.dataset.hvar); window.scrollTo(0,0); return hwView(); }
  if(b.id==='hwSwitch'){ setVariant(null); window.scrollTo(0,0); return hwView(); }
  if(b.dataset.hmc){ const id=b.dataset.hmc, [key,i]=id.split('.'), it=hwItems(key)[+i], k=+b.dataset.k; if(HW[id]&&HW[id].ok!==undefined) return;
    HW[id]={v:k, ok:k===it.a}; hwSave(); beep(k===it.a); return hwRerender(); }
  if(b.dataset.hcheck) return hwCheck(b.dataset.hcheck,false);
  if(b.dataset.hgive) return hwCheck(b.dataset.hgive,true);
  if(b.dataset.hshow){ const id=b.dataset.hshow; const el=document.querySelector(`[data-hin="${id}"]`); HW[id]={...(HW[id]||{}), v:el?el.value:'', shown:true}; hwSave(); return hwRerender(); }
  if(b.dataset.hself){ const id=b.dataset.hself; HW[id]={...(HW[id]||{}), self:b.dataset.yes==='1'}; hwSave(); beep(b.dataset.yes==='1'); return hwRerender(); }
  if(answered) return;
  if(b.dataset.opt!==undefined){ document.querySelectorAll('.o.sel').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); setCheck('Проверить',false);
    if(cur.t==='ru2en') say(cur.opts[+b.dataset.opt].en); return; }
  if(b.dataset.take!==undefined){ const p=cur.pool[+b.dataset.take]; if(!cur.ans.includes(p)){ cur.ans.push(p); drawTiles(); } return; }
  if(b.dataset.back!==undefined){ cur.ans.splice(+b.dataset.back,1); drawTiles(); return; }
  if(b.dataset.pair!==undefined){
    const [side,id]=b.dataset.pair.split(':'); const w=byId[id];
    if(side==='l') say(w.en);
    if(!cur.sel || cur.sel.side===side){ cur.sel={side,w}; drawPairs(); return; }
    if(cur.sel.w===w){ cur.done.add(w.id); cur.sel=null; beep(true); drawPairs();
      if(cur.done.size===cur.ws.length){ cur.w=cur.ws[0]; answered=true; totalCount++; correctCount+= cur.miss===0?1:0; sessXp+=cur.miss===0?15:5;
        const foot=document.getElementById('foot'); foot.classList.add('ok');
        document.getElementById('fbArea').innerHTML=`<div class="fb">${cur.miss?'Все пары найдены':'Идеально! Без ошибок'}</div>`; setCheck('Дальше',false); }
    } else { cur.miss++; cur.sel=null; beep(false); b.classList.add('wrong'); setTimeout(drawPairs,350); }
  }
});
app.addEventListener('input',e=>{
  if(e.target.id==='typ') setCheck('Проверить', !e.target.value.trim());
  const id=e.target.dataset.hin; if(id){ HW[id]={...(HW[id]||{}), v:e.target.value}; hwSave(); }
});
app.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const c=document.getElementById('check'); if(c && !c.disabled && !c.hidden){ e.preventDefault(); c.click(); } } });

route();
window.addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(['words','hw','rules'].includes(t) && t!==TAB && !document.querySelector('.ex')){ TAB=t; route(); } });
autoCheck();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') autoCheck(); });
</script>
